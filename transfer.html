<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfer — RUFT Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
      <link rel="stylesheet" href="assets/css/animations.css" />
    <link rel="stylesheet" href="assets/css/i18n.css" />
    <script src="assets/js/i18n-dict.js"></script>
    <script src="assets/js/i18n.js"></script>
  </head>
  <body class="app-body">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="content">
          <div class="page-head">
            <div>
              <h1>Transfer Money</h1>
              <p>Send funds instantly to anyone, anywhere.</p>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-head">
                <h3><i class="fa-solid fa-paper-plane"></i> New Transfer</h3>
              </div>
              <form id="transferForm">
                <div class="form-group">
                  <label>Recipient</label>
                  <input
                    type="text"
                    id="trRecipient"
                    placeholder="Name or account number"
                  />
                </div>
                <div class="form-row-2">
                  <div class="form-group">
                    <label>Amount</label>
                    <input
                      type="number"
                      id="trAmount"
                      placeholder="0.00"
                      min="0"
                      step="0.01"
                    />
                  </div>
                  <div class="form-group">
                    <label>Currency</label>
                    <select id="trCurrency">
                      <option>USD</option>
                      <option>EUR</option>
                      <option>UZS</option>
                      <option>GBP</option>
                      <option>RUB</option>
                    </select>
                  </div>
                </div>
                <div class="form-group">
                  <label>Description</label>
                  <input
                    type="text"
                    id="trDescription"
                    placeholder="What's this for?"
                  />
                </div>
                <div class="form-group">
                  <label>Schedule</label>
                  <select id="trSchedule">
                    <option value="now">Send now</option>
                    <option value="tomorrow">Tomorrow</option>
                    <option value="nextweek">Next week</option>
                    <option value="custom">Custom date</option>
                  </select>
                </div>
                <label class="checkbox"
                  ><input type="checkbox" id="trFavorite" /> Add to favorite
                  recipients</label
                >
                <button type="submit" class="btn btn-primary btn-block">
                  Send Transfer <i class="fa-solid fa-arrow-right"></i>
                </button>
              </form>
            </div>

            <div>
              <div class="card">
                <div class="card-head">
                  <h3><i class="fa-solid fa-star"></i> Favorite Recipients</h3>
                </div>
                <div class="fav-list" id="favList"></div>
              </div>
              <div class="card">
                <div class="card-head">
                  <h3>
                    <i class="fa-solid fa-clock-rotate-left"></i> Recent
                    Transfers
                  </h3>
                </div>
                <div class="tx-list" id="recentTransfers"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/transfer.js"></script>
      <script src="assets/js/animations.js"></script>
  </body>
</html>
